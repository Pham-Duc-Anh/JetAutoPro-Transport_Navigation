# Bridge cho joint_states (Gazebo -> ROS 2)
# Publish sang topic riêng để không xung đột với joint_state_publisher
- ros_topic_name: "/gz_joint_states"
  gz_topic_name: "/joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "ignition.msgs.Model"
  direction: GZ_TO_ROS

